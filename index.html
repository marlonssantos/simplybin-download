<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Download SimplyBin for iOS or Android">
  <title>Get SimplyBin</title>
  <style>
    :root {
      --ios: #0070c9;
      --android: #01875f;
      --text: #222;
      --muted: #666;
      --bg: #f8f9fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-top: 5vh;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.25rem;
    }

    .tagline {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    #message {
      font-size: 1rem;
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }

    .coming-soon h2 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }

    .coming-soon p {
      margin: 0 0 0.75rem;
    }

    .coming-soon .android-note {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .coming-soon .android-note a {
      color: var(--android);
      font-weight: 600;
    }

    .buttons {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: block;
      padding: 1rem;
      border-radius: 0.75rem;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: transform 0.1s ease;
    }

    .btn:hover,
    .btn:active {
      transform: translateY(-2px);
    }

    .btn.appstore {
      background: var(--ios);
    }

    .btn.disabled,
    .btn.disabled:hover,
    .btn.disabled:active {
      opacity: 0.55;
      cursor: default;
      transform: none;
    }

    .btn.playstore {
      background: var(--android);
    }

    .footer {
      margin-top: auto;
      padding-top: 2rem;
      font-size: 0.8rem;
      color: #888;
    }

    /* ── iOS coming-soon: full-screen screenshot background ── */

    body.ios-bg {
      padding: 0;
      /* Fallback colour while the image loads */
      background-color: #1646a9;
      background-image: url('app-screenshot.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      align-items: stretch;
    }

    body.ios-bg .container {
      max-width: 100%;
      margin-top: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0;
    }

    /* Hide the generic header — the screenshot has the app branding */
    body.ios-bg h1,
    body.ios-bg .tagline,
    body.ios-bg #message {
      display: none;
    }

    /* Gradient scrim + card at the bottom */
    body.ios-bg .coming-soon {
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(8, 24, 70, 0.93) 22%
      );
      padding: 4rem 2rem 3rem;
      color: #fff;
      text-align: center;
    }

    body.ios-bg .coming-soon h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 0.5rem;
    }

    body.ios-bg .coming-soon p {
      color: rgba(255, 255, 255, 0.88);
      margin: 0 0 0.75rem;
    }

    body.ios-bg .coming-soon .android-note {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
    }

    body.ios-bg .coming-soon .android-note a {
      color: #6ee7a0;
      font-weight: 600;
      text-decoration: none;
    }

    body.ios-bg .footer {
      display: none;
    }
  </style>
  <noscript>
    <style>
      /* With JavaScript disabled, show the store buttons and hide
         the detection message (which never gets replaced). */
      #message { display: none; }
      .buttons { display: flex; }
    </style>
  </noscript>
</head>
<body>
  <main class="container">
    <h1>Get SimplyBin</h1>
    <p class="tagline">Know what's in every box or around your house.</p>

    <p id="message"></p>

    <div id="comingSoon" class="coming-soon" hidden>
      <h2>SimplyBin is coming to the App Store</h2>
      <p><strong>Available November 10, 2026.</strong> Check back soon!</p>
      <p class="android-note">Using Android? <a id="androidNoteLink" href="#" target="_blank" rel="noopener noreferrer">Get it on Google Play</a></p>
    </div>

    <div id="buttons" class="buttons">
      <a id="appleBtn" class="btn appstore disabled" aria-disabled="true">App Store – Coming Nov 10, 2026</a>
      <a id="googleBtn" class="btn playstore" href="https://play.google.com/store/apps/details?id=com.simplybin.myapp&amp;hl=en-US" target="_blank" rel="noopener noreferrer">Get it on Google Play</a>
    </div>
  </main>

  <footer class="footer">
    <noscript>
      <p>JavaScript is disabled. SimplyBin is available now on Google Play; the App Store version launches November 10, 2026.</p>
    </noscript>
  </footer>

  <script>
    // ============================================================
    // CONFIGURATION
    //
    // SimplyBin launches on the App Store on November 10, 2026.
    // Until then, iOS visitors see a "coming soon" view instead of
    // being sent to an App Store listing that doesn't exist yet.
    //
    // LAUNCH DAY — 2-step switch (do NOT flip early; Apple's
    // release can slip):
    //   1. Paste the real App Store link into APP_STORE_URL.
    //   2. Set APP_STORE_LIVE to true.
    //
    // Once live, the page behaves as before: iOS redirects to the
    // App Store and the desktop App Store button links to it.
    // ============================================================
    const APP_STORE_LIVE = false;
    const APP_STORE_URL = ''; // fill in the real App Store link on launch day
    const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.simplybin.myapp&hl=en-US';

    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    const maxTouch = navigator.maxTouchPoints || 0;

    // iOS detection includes iPhones, iPods, iPads, and iPads running
    // iPadOS 13+ in desktop mode, which report a "Macintosh" user agent
    // (and a "MacIntel" platform) but still have touch points.
    const isMacWithTouch = maxTouch > 1 && (/Macintosh/i.test(ua) || platform === 'MacIntel');
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || isMacWithTouch;
    const isAndroid = /Android/i.test(ua);

    // Guard against flipping the switch without filling in the URL:
    // redirecting to an empty URL would just reload the page in a loop.
    const appStoreReady = APP_STORE_LIVE && APP_STORE_URL !== '';

    const messageEl = document.getElementById('message');
    const comingSoonEl = document.getElementById('comingSoon');
    const buttonsEl = document.getElementById('buttons');
    const appleBtn = document.getElementById('appleBtn');
    const googleBtn = document.getElementById('googleBtn');

    googleBtn.href = PLAY_STORE_URL;
    document.getElementById('androidNoteLink').href = PLAY_STORE_URL;

    // Until launch, the App Store button stays a disabled "coming soon"
    // badge (its markup default, so it works without JavaScript too).
    // Once live, restore it to a real link.
    if (appStoreReady) {
      appleBtn.href = APP_STORE_URL;
      appleBtn.textContent = 'Download on the App Store';
      appleBtn.classList.remove('disabled');
      appleBtn.removeAttribute('aria-disabled');
    }

    function showFallback(text) {
      messageEl.textContent = text;
      buttonsEl.style.display = 'flex';
    }

    messageEl.textContent = 'Detecting your device...';

    if (isIOS) {
      if (appStoreReady) {
        messageEl.textContent = 'Opening the App Store...';
        window.location.href = APP_STORE_URL;
      } else {
        // App Store launches November 10, 2026: show the coming-soon
        // view on this page instead of redirecting.
        messageEl.hidden = true;
        comingSoonEl.hidden = false;
        document.body.classList.add('ios-bg');
      }
    } else if (isAndroid) {
      messageEl.textContent = 'Opening Google Play...';
      window.location.href = PLAY_STORE_URL;
    } else {
      // Desktop or unknown device: show both download options.
      showFallback('Choose your store to download SimplyBin:');
    }
  </script>
</body>
</html>
